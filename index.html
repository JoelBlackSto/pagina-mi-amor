<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Nosotros 💖</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffe6e6, #ffecec);
      margin: 0;
      padding: 0;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      color: #d6336c;
      margin-top: 30px;
      animation: fadeInDown 2s ease;
    }

    .carousel {
      position: relative;
      max-width: 600px;
      margin: 40px auto;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      animation: fadeIn 3s ease;
    }

    .slides {
      display: flex;
      width: 100%;
      animation: slide 20s infinite;
    }

    .slides img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 20px;
    }

    .text-content {
      max-width: 700px;
      margin: 40px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
      animation: fadeInUp 2s ease;
    }

    .text-content p {
      font-size: 1.2em;
      line-height: 1.6em;
      color: #444;
    }

    /* Animaciones */
    @keyframes slide {
      0%    { transform: translateX(0); }
      20%   { transform: translateX(0); }
      25%   { transform: translateX(-100%); }
      45%   { transform: translateX(-100%); }
      50%   { transform: translateX(-200%); }
      70%   { transform: translateX(-200%); }
      75%   { transform: translateX(-300%); }
      95%   { transform: translateX(-300%); }
      100%  { transform: translateX(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Corazoncitos */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      transform: rotate(45deg);
      animation: floatUp 10s infinite ease-in;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      to {
        transform: translateY(-100vh) rotate(45deg);
        opacity: 0;
      }
    }
    .modal-entrada {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 240, 240, 0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeIn 2s ease;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  background-color: #d6336c;
  border: none;
  color: white;
  border-radius: 10px;
  font-size: 1.1em;
  cursor: pointer;
  transition: transform 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.ramo-container {
  position: relative;
  width: 80px;
  height: 120px;
  animation: popIn 1s ease-out;
}

.tallo {
  width: 10px;
  height: 100px;
  background: green;
  margin: 0 auto;
  border-radius: 5px;
}

.rosa {
  width: 30px;
  height: 30px;
  background: radial-gradient(circle at 10px 10px, #ff4d6d, #c9184a);
  border-radius: 50%;
  position: absolute;
  top: 0;
  animation: petalo 4s infinite ease-in-out;
}

.rosa1 { left: -20px; animation-delay: 0s; }
.rosa2 { left: 0px; animation-delay: 0.2s; }
.rosa3 { left: 20px; animation-delay: 0.4s; }

@keyframes popIn {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes petalo {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(10deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

  </style>
</head>
<body>

  <!-- Modal animado al cargar -->
<div id="entradaModal" class="modal-entrada">
  <div class="ramo-container">
    <div class="tallo"></div>
    <div class="rosa rosa1"></div>
    <div class="rosa rosa2"></div>
    <div class="rosa rosa3"></div>
  </div>
  <p style="color:#d6336c;font-size:1.2em;margin-top:20px;">Un regalito para ti 💐</p>
  <button onclick="cerrarModal()">Ver regalo 💌</button>
</div>

  <!-- Música de fondo -->
  <audio autoplay loop>
    <source src="musica/antonia.mp3" type="audio/mpeg">
    Tu navegador no soporta el audio.
  </audio>

  <!-- Corazoncitos -->
  <div class="hearts">
    <div class="heart" style="left:10%; animation-delay: 0s;"></div>
    <div class="heart" style="left:25%; animation-delay: 2s;"></div>
    <div class="heart" style="left:40%; animation-delay: 4s;"></div>
    <div class="heart" style="left:60%; animation-delay: 6s;"></div>
    <div class="heart" style="left:80%; animation-delay: 8s;"></div>
  </div>

  <h1>Para Nosotros 💞</h1>

  <div class="carousel">
    <div class="slides">
      <img src="fotos/foto01.jpg" alt="Foto 1">
      <img src="fotos/foto02.jpg" alt="Foto 2">
      <img src="fotos/foto03.jpg" alt="Foto 3">
      <img src="fotos/foto04.jpg" alt="Foto 4">
      <img src="fotos/foto05.jpg" alt="Foto 5">
      <img src="fotos/foto06.jpg" alt="Foto 6">
      <img src="fotos/foto07.jpg" alt="Foto 7">
      <img src="fotos/foto08.jpg" alt="Foto 8">
      <img src="fotos/foto09.jpg" alt="Foto 9">
      <img src="fotos/foto10.jpg" alt="Foto 10">
      <img src="fotos/foto11.jpg" alt="Foto 11">
      <img src="fotos/foto12.jpg" alt="Foto 12">
      <img src="fotos/foto13.jpg" alt="Foto 13">
      <img src="fotos/foto14.jpg" alt="Foto 14">
    </div>
  </div>

  <div class="text-content">
    <p>
      <!-- Tu texto especial aquí -->
      Cada momento contigo es hermoso e inolvidable. eres el amor de mi vida sin duda alguna
      te amo mas de lo que crees, te amo mas que ayer y menos que mañana, Esta página es solo una pequeña
       forma de recordarte cuánto te amo y cuánto significas para mí 💗.
    </p>
  </div>
<script>
  function cerrarModal() {
    document.getElementById("entradaModal").style.display = "none";
  }
</script>

</body>
</html>
